name: Build Clients (local, no hot-update)
# trigger: dual server address feature
# trigger: UI cleanup (no download tab, trimmed about)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/local-build.yml'

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install root deps
        run: npm install --no-audit --no-fund

      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Install frontend deps
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build backend + frontend
        run: |
          npm run build:backend
          npm run build:frontend

      - name: Rebuild native modules
        run: npm run rebuild:native -- --target-platform=win32 --target-arch=x64

      - name: Verify native binary
        run: |
          ls -l backend/node_modules/better-sqlite3/build/Release/ || true
          node -e "const D=require('./backend/node_modules/better-sqlite3');const d=new D(':memory:');d.exec('create table t(a)');console.log('better-sqlite3 OK')"

      - name: Package Windows (dir only)
        continue-on-error: true
        run: |
          set +e
          npx --no-install electron-builder --win dir --config electron/builder.config.js --publish never > build-dir.log 2>&1
          echo "exit=$?" >> build-dir.log
          ls -la dist-electron >> build-dir.log 2>&1
          tail -n 40 build-dir.log

      - name: Zip unpacked
        if: always()
        run: |
          ls -la dist-electron/win-unpacked 2>/dev/null | head -20
          if [ -d dist-electron/win-unpacked ]; then
            7z a -tzip nowen-windows-portable.zip ./dist-electron/win-unpacked/* > /dev/null
            echo "zipped"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nowen-windows
          path: |
            build-dir.log
            nowen-windows-portable.zip
            dist-electron/*.exe
            dist-electron/*.zip
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "$ANDROID_HOME" 2>/dev/null | head -10 || true

      - name: Install root deps
        run: npm install --no-audit --no-fund

      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Install frontend deps
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build:frontend

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nowen-android
          path: |
            frontend/android/app/build/outputs/apk/**/*.apk
            frontend/android/gradle.log
          if-no-files-found: warn
